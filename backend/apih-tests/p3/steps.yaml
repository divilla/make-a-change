        method: POST
        path: /api/v1/change/list
        body: '{"project_id":1002}'
      response:
        expected_status: 200
        expected_body: '[]'
    - request:
        method: POST
        path: /api/v1/change/documents
        body: '{"id":2205}'
      response:
        expected_status: 200
        expected_body: '[]'
    - request:
        method: POST
        path: /api/v1/change/rendered-artifacts
        body: '{"ids":[2207,999999,2205,2207]}'
      response:
        expected_status: 200
        expected_body: '{"artifacts":[{"id":2207,"spec_html":"<p>Latest duplicate</p>\n","pr_html":""},{"id":2205,"spec_html":"","pr_html":""}]}'
    - request:
        method: POST
        path: /api/v1/change/rendered-artifacts
        body: '{"ids":[]}'
      response:
        expected_status: 200
        expected_body: '{"artifacts":[]}'
    - request:
        method: POST
        path: /api/v1/change/create
        body: '{"project_id":1002,"title":" Generated ","brief":" Initial brief "}'
      response:
        expected_status: 201
        expected_types:
          .id: [number]
        capture:
          p3_id: .id
    - request:
        method: POST
        path: /api/v1/change/get
        body: '{"id":${p3_id}}'
      response:
        expected_status: 200
        expected_body: '{"id":${p3_id},"project_id":1002,"title":"Generated","change_phase":"backlog","change_types":[],"ref":null,"slug":null,"epic_id":null,"open":true,"done_tc":0,"total_tc":0,"completed":0}'
