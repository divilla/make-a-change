app: apihydra
kind: steps
metadata:
  name: p3-change-documents
spec:
  defaults:
    retries: -1
    headers:
      Content-Type: application/json
  steps:
    - request:
        method: POST
        path: /api/v1/change/list
        body: '{"project_id":2001}'
