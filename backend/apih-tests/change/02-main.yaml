  # Errors from PostgreSQL-rejected NUL text return a masked 500; owned IDs only.
  - request:
      method: POST
      path: /api/v1/change/create
      body: '{"project_id":${change_project},"title":"Invalid\u0000title","brief":"Valid brief"}'
    response:
      expected_status: 500
      expected_body: '{"message":"Internal Server Error"}'
      expected_types:
        if keys == ["message"] then 0 else 1 end:
        - zero
  - request:
      method: POST
      path: /api/v1/change/create
      body: '{"project_id":${change_project},"title":"Valid title","brief":"Invalid\u0000brief"}'
    response:
      expected_status: 500
      expected_body: '{"message":"Internal Server Error"}'
      expected_types:
        if keys == ["message"] then 0 else 1 end:
        - zero
  - request:
      method: POST
      path: /api/v1/change/update-title
      body: '{"id":${change_id},"title":"Invalid\u0000title"}'
    response:
      expected_status: 500
      expected_body: '{"message":"Internal Server Error"}'
      expected_types:
        if keys == ["message"] then 0 else 1 end:
        - zero
  - request:
      method: POST
      path: /api/v1/change/details
      body: '{"id":${change_id}}'
    response:
      expected_status: 200
      expected_body: '{"title":"Updated title","active":true,"after_change_id":null,"epic_id":null,"pr_url":"https://example.com/pull/123","change_types":[]}'
