    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/change/details
      body: '{"id":${change_id}}'
    response:
      expected_status: 200
      expected_body: '{"epic_id":null,"epic_name":null}'
  - request:
      method: POST
      path: /api/v1/change/update-epic
      body: '{"id":${change_id}}'
    response:
      expected_status: 204
  - request:
