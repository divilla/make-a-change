app: apihydra
kind: steps
metadata:
  name: change-02-main
spec:
  steps:
  - request:
      method: POST
      path: /api/v1/change/list
      body: '{"project_id":$change_project}'
    response:
      expected_status: 200
      expected_body: '[]'
  - request:
      method: POST
      path: /api/v1/change/create
      body: '{"project_id":$change_project,"title":" APIHydra  change ","brief":" Initial brief "}'
    response:
      expected_status: 201
      expected_types:
        .id:
        - int
      capture:
        change_id: .id
  - request:
      method: POST
      path: /api/v1/change/details
      body: '{"id":${change_id}}'
    response:
      expected_status: 200
      expected_body: '{"id":${change_id},"project_id":${change_project},"title":"APIHydra  change","change_phase":"backlog","after_change_id":null,"epic_id":null,"open":true,"done_tc":0,"total_tc":0,"completed":0,"pr_url":""}'
      expected_types:
        .created_at:
        - string
        .updated_at:
        - string
        .ref_uuid:
        - string
        if (.ref_uuid | test("^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$")) then 0 else 1 end:
        - zero
      capture:
        change_uuid: .ref_uuid
  - request:
      method: POST
      path: /api/v1/change/create
      body: '{"project_id":${change_project},"title":"Duplicate UUID","brief":"Brief","ref_uuid":${change_uuid}}'
    response:
      expected_status: 409
  - request:
      method: POST
      path: /api/v1/change/create
      body: '{"project_id":${change_project},"title":"Prerequisite","brief":"Brief"}'
    response:
      expected_status: 201
      expected_types:
        .id:
        - int
      capture:
        change_prerequisite: .id
  - request:
      method: POST
      path: /api/v1/change/update-after-change
      body: '{"id":${change_id},"after_change_id":${change_prerequisite}}'
    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/change/details
      body: '{"id":${change_id}}'
    response:
      expected_status: 200
      expected_body: '{"after_change_id":${change_prerequisite}}'
  - request:
      method: POST
      path: /api/v1/change/delete
      body: '{"id":${change_prerequisite}}'
    response:
      expected_status: 409
  - request:
      method: POST
      path: /api/v1/change/list
      body: '{"project_id":${change_project}}'
    response:
      expected_status: 200
      expected_body: '[{"id":${change_id}},{"id":${change_prerequisite}}]'
  - request:
      method: POST
      path: /api/v1/change/update-after-change
      body: '{"id":${change_id},"after_change_id":null}'
    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/change/details
      body: '{"id":${change_id}}'
    response:
      expected_status: 200
      expected_body: '{"after_change_id":null}'
  - request:
      method: POST
      path: /api/v1/change/update-after-change
      body: '{"id":${change_id}}'
    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/change/update-after-change
      body: '{"id":${change_id},"after_change_id":${change_missing}}'
    response:
      expected_status: 400
  - request:
