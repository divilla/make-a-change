app: apihydra
kind: steps
metadata:
  name: change-01-init
spec:
  steps:
  - request:
      method: POST
      path: /api/v1/project/create
      body: '{"name":"APIHydra changes"}'
    response:
      expected_status: 201
      expected_types:
        .id:
        - int
      capture:
        change_project: .id
  - request:
      method: POST
      path: /api/v1/project/config
      body: '{"id":${change_project}}'
    response:
      expected_status: 200
      expected_body: '{"slug":"default"}'
      expected_types:
        .change_docs:
        - array
        .change_phases:
        - array
      capture:
        change_phase: .change_phases[-1]
        change_type: .change_types[0]
        change_project_doc: .project_docs[0]
        change_epic_doc: .epic_docs[0]
  - request:
      method: POST
      path: /api/v1/epic/create
      body: '{"project_id":${change_project},"name":"APIHydra change epic"}'
    response:
      expected_status: 201
      expected_types:
        .id:
        - int
      capture:
        change_epic: .id
  - request:
      method: POST
      path: /api/v1/project/create
      body: '{"name":"APIHydra other change project"}'
    response:
      expected_status: 201
      expected_types:
        .id:
        - int
      capture:
        change_other_project: .id
  - request:
      method: POST
      path: /api/v1/epic/create
      body: '{"project_id":${change_other_project},"name":"Cross-project epic"}'
    response:
      expected_status: 201
      expected_types:
        .id:
        - int
      capture:
        change_other_epic: .id
  - request:
      method: POST
      path: /api/v1/epic/create
      body: '{"project_id":${change_project},"name":"Deleted epic"}'
    response:
      expected_status: 201
      expected_types:
        .id:
        - int
      capture:
        change_missing_epic: .id
  - request:
      method: POST
      path: /api/v1/epic/delete
      body: '{"id":${change_missing_epic}}'
    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/change/create
      body: '{"project_id":${change_project},"title":"Deleted change","brief":"Deleted"}'
    response:
      expected_status: 201
      expected_types:
        .id:
        - int
      capture:
        change_missing: .id
  - request:
      method: POST
      path: /api/v1/change/delete
      body: '{"id":${change_missing}}'
    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/project/create
      body: '{"name":"Deleted change parent"}'
    response:
      expected_status: 201
      expected_types:
        .id:
        - int
      capture:
        change_missing_project: .id
  - request:
      method: POST
      path: /api/v1/project/delete
      body: '{"id":${change_missing_project}}'
    response:
      expected_status: 204
