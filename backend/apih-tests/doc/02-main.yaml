    response:
      expected_status: 404
  - request:
      method: POST
      path: /api/v1/doc/comment-list
      body: '{"ref_table":"project","ref_id":${doc_project}}'
    response:
      expected_status: 200
      expected_body: '[]'
  - request:
      method: POST
      path: /api/v1/doc/comment-insert
      body: '{"ref_table":"project","ref_id":${doc_project},"body":" **Comment** ","agent_edit":false}'
    response:
      expected_status: 201
      capture:
        doc_comment_project: .id
  - request:
      method: POST
      path: /api/v1/doc/comment-list
      body: '{"ref_table":"project","ref_id":${doc_project}}'
    response:
      expected_status: 200
      expected_body: '[{"id":${doc_comment_project},"doc_type":"comment","body":"**Comment**","deleted_at":null,"html":"<p><strong>Comment</strong></p>\n"}]'
  - request:
      method: POST
      path: /api/v1/doc/list
      body: '{"ref_table":"project","ref_id":${doc_project}}'
    response:
      expected_status: 200
      expected_types:
        if any(.[]; .doc_type == "comment") then 0 else 1 end:
        - zero
  - request:
      method: POST
      path: /api/v1/doc/list-active
      body: '{"ref_table":"project","ref_id":${doc_project}}'
    response:
      expected_status: 200
      expected_types:
        if all(.[]; .doc_type != "comment") then 0 else 1 end:
        - zero
  - request:
      method: POST
      path: /api/v1/doc/comment-update
      body: '{"id":${doc_comment_project},"body":"Edited comment"}'
    response:
