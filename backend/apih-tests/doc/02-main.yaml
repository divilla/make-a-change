  - request:
      method: POST
      path: /api/v1/doc/comment-list
      body: '{"ref_table":"project","ref_id":${doc_project}}'
    response:
      expected_status: 200
      expected_body: '[{"id":${doc_comment_project},"body":""}]'
      expected_types:
        .[0].deleted_at:
        - string
  - request:
      method: POST
      path: /api/v1/doc/details
      body: '{"id":${doc_comment_project}}'
    response:
