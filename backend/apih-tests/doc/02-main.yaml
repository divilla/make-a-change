  - request:
      method: POST
      path: /api/v1/doc/insert
      body: '{"ref_id":${doc_change},"ref_table":"invalid","doc_type":"brief","body":"Valid","agent_edit":false}'
    response:
      expected_status: 400
      expected_types:
        .message:
        - string
  - request:
      method: POST
