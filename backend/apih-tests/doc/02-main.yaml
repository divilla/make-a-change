  # Database-rejected document bodies return masked 500 without altering history.
  - request:
      method: POST
      path: /api/v1/doc/insert
      body: '{"ref_id":${doc_project},"ref_table":"project","doc_type":${doc_project_doc},"body":"Invalid\u0000body","agent_edit":false}'
    response:
      expected_status: 500
      expected_body: '{"message":"Internal Server Error"}'
      expected_types:
        if keys == ["message"] then 0 else 1 end:
        - zero
