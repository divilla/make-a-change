app: apihydra
kind: steps
metadata:
  name: doc-03-post
spec:
  steps:
  - request:
      method: POST
      path: /api/v1/change/delete
      body: '{"id":${doc_change}}'
    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/epic/delete
      body: '{"id":${doc_epic}}'
    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/project/delete
      body: '{"id":${doc_project}}'
    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/doc/list-active
      body: '{"ref_id":${doc_project},"ref_table":"project"}'
    response:
      expected_status: 200
      expected_body: '[{"id":${doc_project_new},"deleted_at":null}]'
  - request:
      method: POST
      path: /api/v1/doc/details
      body: '{"id":${doc_project_new}}'
    response:
      expected_status: 200
      expected_body: '{"deleted_at":null}'
  - request:
      method: POST
      path: /api/v1/doc/insert
      body: '{"ref_id":${doc_project},"ref_table":"project","doc_type":${doc_project_doc},"body":"No resurrection","agent_edit":false}'
    response:
      expected_status: 404
  - request:
      method: POST
      path: /api/v1/doc/list-active
      body: '{"ref_id":${doc_epic},"ref_table":"epic"}'
    response:
      expected_status: 200
      expected_body: '[{"id":${doc_epic_new},"deleted_at":null}]'
  - request:
      method: POST
      path: /api/v1/doc/details
      body: '{"id":${doc_epic_new}}'
    response:
      expected_status: 200
      expected_body: '{"deleted_at":null}'
  - request:
      method: POST
      path: /api/v1/doc/insert
      body: '{"ref_id":${doc_epic},"ref_table":"epic","doc_type":${doc_epic_doc},"body":"No resurrection","agent_edit":false}'
    response:
      expected_status: 404
  - request:
      method: POST
      path: /api/v1/doc/list-active
      body: '{"ref_id":${doc_change},"ref_table":"change"}'
    response:
      expected_status: 200
      expected_body: '[]'
  - request:
      method: POST
      path: /api/v1/doc/details
      body: '{"id":${doc_safe}}'
    response:
      expected_status: 200
      expected_types:
        .deleted_at:
        - string
  - request:
      method: POST
      path: /api/v1/doc/insert
      body: '{"ref_id":${doc_change},"ref_table":"change","doc_type":"brief","body":"No resurrection","agent_edit":false}'
    response:
      expected_status: 404
  - request:
      method: POST
      path: /api/v1/doc/delete
      body: '{"id":${doc_project_old}}'
    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/doc/delete
      body: '{"id":${doc_project_new}}'
    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/doc/delete
      body: '{"id":${doc_epic_old}}'
    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/doc/delete
      body: '{"id":${doc_epic_new}}'
    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/doc/delete
      body: '{"id":${doc_original}}'
    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/doc/delete
      body: '{"id":${doc_change_old}}'
    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/doc/delete
      body: '{"id":${doc_change_new}}'
    response:
      expected_status: 204

  # Each removed parent rejects new comments, while retained history remains available.
  - request:
      method: POST
      path: /api/v1/doc/comment-insert
      body: '{"ref_id":${doc_project},"ref_table":"project","body":"Removed parent","agent_edit":false}'
    response:
      expected_status: 404
      expected_body: '{"message":"doc parent not found"}'
  - request:
      method: POST
      path: /api/v1/doc/comment-insert
      body: '{"ref_id":${doc_epic},"ref_table":"epic","body":"Removed parent","agent_edit":false}'
    response:
      expected_status: 404
      expected_body: '{"message":"doc parent not found"}'
  - request:
      method: POST
      path: /api/v1/doc/comment-insert
      body: '{"ref_id":${doc_change},"ref_table":"change","body":"Removed parent","agent_edit":false}'
    response:
      expected_status: 404
      expected_body: '{"message":"doc parent not found"}'
