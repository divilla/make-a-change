        body: '{"change_id":${p4_change}}'
      response:
        expected_status: 200
        expected_body: '[{"id":${p4_first},"change_id":${p4_change},"scenario":"First case","done":true},{"id":${p4_second},"change_id":${p4_change},"scenario":"Edited case","done":true}]'
    - request:
        method: POST
