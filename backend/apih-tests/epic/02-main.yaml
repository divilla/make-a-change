  # Independent error cases: each malformed field has otherwise valid input.
  # list: project_id null; other fields valid
  - request:
      method: POST
      path: /api/v1/epic/list
      body: '{"project_id":null}'
    response:
      expected_status: 400
      expected_body: '{"message":"invalid epic payload"}'
  # list: project_id zero; other fields valid
  - request:
      method: POST
      path: /api/v1/epic/list
      body: '{"project_id":0}'
    response:
      expected_status: 400
      expected_body: '{"message":"invalid epic payload"}'
  # list: project_id fraction; other fields valid
  - request:
      method: POST
      path: /api/v1/epic/list
      body: '{"project_id":-1.5}'
    response:
      expected_status: 400
      expected_body: '{"message":"invalid epic list payload"}'
  # list: project_id integer underflow; other fields valid
  - request:
      method: POST
      path: /api/v1/epic/list
      body: '{"project_id":-9223372036854775809}'
    response:
      expected_status: 400
      expected_body: '{"message":"invalid epic list payload"}'
  # list: array body
  - request:
      method: POST
      path: /api/v1/epic/list
      body: '[]'
    response:
      expected_status: 400
      expected_body: '{"message":"invalid epic list payload"}'
  # list: string body
  - request:
      method: POST
      path: /api/v1/epic/list
      body: '"invalid"'
    response:
      expected_status: 400
      expected_body: '{"message":"invalid epic list payload"}'
  # list: wrong HTTP method
  - request:
      method: GET
      path: /api/v1/epic/list
    response:
      expected_status: 405
      expected_body: '{"message":"Method Not Allowed"}'
  # list-inactive: project_id null; other fields valid
