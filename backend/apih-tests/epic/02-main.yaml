  # delete: id zero; other fields valid
  - request:
      method: POST
      path: /api/v1/epic/delete
      body: '{"id":0}'
    response:
      expected_status: 400
      expected_body: '{"message":"invalid epic payload"}'
  # delete: id fraction; other fields valid
  - request:
      method: POST
      path: /api/v1/epic/delete
      body: '{"id":-1.5}'
    response:
      expected_status: 400
      expected_body: '{"message":"invalid epic delete payload"}'
  # delete: id integer underflow; other fields valid
  - request:
      method: POST
      path: /api/v1/epic/delete
      body: '{"id":-9223372036854775809}'
    response:
      expected_status: 400
      expected_body: '{"message":"invalid epic delete payload"}'
  # delete: array body
  - request:
      method: POST
      path: /api/v1/epic/delete
      body: '[]'
    response:
      expected_status: 400
      expected_body: '{"message":"invalid epic delete payload"}'
  # delete: string body
  - request:
      method: POST
      path: /api/v1/epic/delete
      body: '"invalid"'
    response:
      expected_status: 400
      expected_body: '{"message":"invalid epic delete payload"}'
  # delete: wrong HTTP method
  - request:
      method: GET
      path: /api/v1/epic/delete
    response:
      expected_status: 405
      expected_body: '{"message":"Method Not Allowed"}'

  # Errors from PostgreSQL-rejected NUL text return a masked 500; owned IDs only.
  - request:
      method: POST
      path: /api/v1/epic/create
      body: '{"project_id":${epic_project},"name":"Invalid\u0000name"}'
    response:
      expected_status: 500
      expected_body: '{"message":"Internal Server Error"}'
      expected_types:
        if keys == ["message"] then 0 else 1 end:
        - zero
  - request:
      method: POST
      path: /api/v1/epic/update
      body: '{"id":${epic_id},"name":"Invalid\u0000name"}'
    response:
      expected_status: 500
      expected_body: '{"message":"Internal Server Error"}'
      expected_types:
        if keys == ["message"] then 0 else 1 end:
        - zero
  - request:
      method: POST
      path: /api/v1/epic/details
      body: '{"id":${epic_id}}'
    response:
      expected_status: 200
      expected_body: '{"name":"Inactive epic renamed","active":false,"change_count":0}'
