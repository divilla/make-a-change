app: apihydra
kind: steps
metadata:
  name: epic-02-main
spec:
  steps:
  - request:
      method: POST
      path: /api/v1/epic/list
      body: '{"project_id":${epic_project}}'
    response:
      expected_status: 200
      expected_body: '[]'
  - request:
      method: POST
      path: /api/v1/epic/list
      body: '{"project_id":${epic_missing_project}}'
    response:
      expected_status: 200
      expected_body: '[]'
  - request:
      method: POST
      path: /api/v1/epic/create
      body: '{"project_id":${epic_project},"name":" APIHydra epic "}'
    response:
      expected_status: 201
      expected_types:
        .id:
        - int
      capture:
        epic_id: .id
  - request:
      method: POST
      path: /api/v1/epic/list
      body: '{"project_id":${epic_project}}'
    response:
      expected_status: 200
      expected_body: '[{"id":${epic_id},"name":"APIHydra epic","done_tc":0,"total_tc":0,"completed":0}]'
  - request:
      method: POST
      path: /api/v1/epic/details
      body: '{"id":${epic_id}}'
    response:
      expected_status: 200
      expected_body: '{"id":${epic_id},"project_id":${epic_project},"name":"APIHydra epic","change_count":0}'
      expected_types:
        .created_at:
        - string
        .updated_at:
        - string
  - request:
      method: POST
      path: /api/v1/epic/update
      body: '{"id":${epic_id},"name":" APIHydra epic renamed "}'
    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/epic/details
      body: '{"id":${epic_id}}'
    response:
      expected_status: 200
      expected_body: '{"name":"APIHydra epic renamed"}'
      expected_types:
        if .updated_at > .created_at then 0 else 1 end:
        - zero
  - request:
      method: POST
      path: /api/v1/epic/update
      body: '{"id":${epic_id},"name":"APIHydra epic renamed"}'
    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/epic/details
      body: '{"id":${epic_id}}'
    response:
      expected_status: 200
      expected_body: '{"name":"APIHydra epic renamed"}'
      expected_types:
        if .updated_at > .created_at then 0 else 1 end:
        - zero
  - request:
      method: POST
      path: /api/v1/change/create
      body: '{"project_id":${epic_project},"title":"Epic child","brief":"Brief"}'
    response:
      expected_status: 201
      expected_types:
        .id:
        - int
      capture:
        epic_change: .id
  - request:
      method: POST
      path: /api/v1/change/update-epic
      body: '{"id":${epic_change},"epic_id":${epic_id}}'
    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/epic/delete
      body: '{"id":${epic_id}}'
    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/epic/details
      body: '{"id":${epic_id}}'
    response:
      expected_status: 200
      expected_body: '{"active":false}'
  - request:
      method: POST
      path: /api/v1/epic/list
      body: '{"project_id":${epic_project}}'
    response:
      expected_status: 200
      expected_body: '[]'
  - request:
      method: POST
      path: /api/v1/epic/list-inactive
      body: '{"project_id":${epic_project}}'
    response:
      expected_status: 200
      expected_body: '[{"id":${epic_id},"active":false,"change_count":1}]'
  - request:
      method: POST
      path: /api/v1/epic/update
      body: '{"id":${epic_id},"name":"Inactive epic renamed"}'
    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/change/create
      body: '{"project_id":${epic_project},"title":"Inactive epic child","brief":"Brief"}'
    response:
      expected_status: 201
      capture:
        epic_inactive_child: .id
  - request:
      method: POST
      path: /api/v1/change/update-epic
      body: '{"id":${epic_inactive_child},"epic_id":${epic_id}}'
    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/change/delete
      body: '{"id":${epic_inactive_child}}'
    response:
      expected_status: 204
  - request:
      method: POST
