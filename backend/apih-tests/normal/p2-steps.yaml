        expected_status: 200
        expected_body: '{"id":1001,"name":"Custom project","config":"p2-custom","last_ref":42,"change_count":1}'
        expected_types:
          .created: [string]
          .modified: [string]
    - request:
        method: POST
        path: /api/v1/project/config
        body: '{"id":1001}'
      response:
        expected_status: 200
        expected_body: '{"slug":"p2-custom","project_docs":["vision","notes"],"epic_docs":["design","risk"],"change_docs":["analysis","decision"],"change_phases":["discover","ship"],"change_colors":["#123456","#abcdef"],"change_types":["experiment","maintenance"]}'
