        method: POST
        path: /api/v1/project/config
        body: '{"id":1002}'
      response:
        expected_status: 200
        expected_body: '{"slug":"default","project_docs":["brief","prd"],"epic_docs":["brief","prd"],"change_docs":["brief","spec","pr","plan","review","comment"],"change_phases":["backlog","todo","in-progress","in-review","in-test","in-prod"],"change_colors":["15","14","10","11","12","13"],"change_types":["feature","fix","refactor","upgrade","chore","docs","test","ci","security","migration","revert","spike"]}'
