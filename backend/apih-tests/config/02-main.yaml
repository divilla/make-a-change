    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/config/details
      body: '{"slug":${config_slug}}'
    response:
      expected_status: 200
      expected_body: '{"slug":${config_slug},"project_docs":["brief"],"epic_docs":["brief"],"change_docs":["brief","spec","review"],"change_phases":["backlog","done"],"change_colors":["blue","green"],"change_types":["fix","feature"]}'
  - request:
      method: POST
      path: /api/v1/config/list
      body: '{}'
    response:
      expected_status: 200
      expected_types:
        .:
        - array
        .[].slug:
        - string
        if ([.[].slug] == ([.[].slug] | sort)) then 0 else 1 end:
        - zero

