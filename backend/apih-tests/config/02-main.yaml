      expected_status: 409
      expected_body: '{"message":"config slug already exists"}'
  - request:
      method: POST
      path: /api/v1/config/details
      body: '{"slug":${config_slug}}'
    response:
      expected_status: 200
      expected_body: '{"slug":${config_slug},"project_docs":["brief"],"epic_docs":["brief"],"change_docs":["brief","spec"],"change_phases":["backlog","done"],"change_colors":["blue","green"],"change_types":["fix","feature"]}'
