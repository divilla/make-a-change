      expected_status: 201
      expected_body: '{"slug":${config_slug}}'
  - request:
      method: POST
      path: /api/v1/config/insert
      body: '{"slug":${config_slug},"project_docs":["brief"],"epic_docs":["brief"],"change_docs":["brief","spec"],"change_phases":["backlog","done"],"change_colors":["blue","green"],"change_types":["fix","feature"]}'
