      path: /api/v1/project/update
      body: '{'
    response:
      expected_status: 400
      expected_types:
        .message:
        - string
  - request:
      method: POST
      path: /api/v1/project/update
      body: '{"id":"bad","name":3}'
    response:
      expected_status: 400
      expected_types:
        .message:
        - string
  - request:
      method: POST
      path: /api/v1/project/update
      body: '{}'
    response:
      expected_status: 400
      expected_types:
        .message:
        - string
  - request:
      method: POST
      path: /api/v1/project/update
      body: '{"id":-1,"name":""}'
    response:
      expected_status: 400
      expected_types:
        .message:
        - string
  - request:
      method: POST
      path: /api/v1/project/update
      body: '{"id":${project_missing},"name":"Missing"}'
    response:
      expected_status: 404
  - request:
      method: POST
      path: /api/v1/project/delete
      body: '{'
    response:
      expected_status: 400
      expected_types:
        .message:
        - string
  - request:
      method: POST
      path: /api/v1/project/delete
      body: '{"id":"bad","name":3}'
    response:
      expected_status: 400
      expected_types:
        .message:
        - string
  - request:
      method: POST
      path: /api/v1/project/delete
      body: '{}'
    response:
      expected_status: 400
      expected_types:
        .message:
        - string
  - request:
      method: POST
      path: /api/v1/project/delete
      body: '{"id":-1,"name":""}'
    response:
      expected_status: 400
      expected_types:
        .message:
        - string
  - request:
      method: POST
      path: /api/v1/project/delete
      body: '{"id":${project_missing},"name":"Missing"}'
    response:
      expected_status: 404
  - request:
      method: POST
      path: /api/v1/project/config
      body: '{'
    response:
      expected_status: 400
      expected_types:
        .message:
        - string
  - request:
      method: POST
      path: /api/v1/project/config
      body: '{"id":"bad","name":3}'
    response:
      expected_status: 400
      expected_types:
        .message:
        - string
  - request:
      method: POST
      path: /api/v1/project/config
      body: '{}'
    response:
      expected_status: 400
      expected_types:
        .message:
        - string
  - request:
      method: POST
      path: /api/v1/project/config
      body: '{"id":-1,"name":""}'
    response:
      expected_status: 400
      expected_types:
        .message:
        - string
  - request:
      method: POST
      path: /api/v1/project/config
      body: '{"id":${project_missing},"name":"Missing"}'
    response:
      expected_status: 404
  - request:
      method: POST
      path: /api/v1/project/create
      body: '{'
    response:
      expected_status: 400
      expected_types:
        .message:
        - string
  - request:
      method: POST
      path: /api/v1/project/create
      body: '{"name":3}'
    response:
      expected_status: 400
      expected_types:
        .message:
        - string
  - request:
      method: POST
      path: /api/v1/project/create
      body: '{}'
    response:
      expected_status: 400
      expected_types:
        .message:
        - string
  - request:
      method: POST
      path: /api/v1/project/create
      body: '{"name":" \t "}'
    response:
      expected_status: 400
      expected_types:
        .message:
        - string
  - request:
      method: POST
      path: /api/v1/project/update
      body: '{"id":${project_id},"name":" \t "}'
    response:
      expected_status: 400
      expected_types:
        .message:
        - string
