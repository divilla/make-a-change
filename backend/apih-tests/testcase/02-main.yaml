      method: POST
      path: /api/v1/test-case/update
      body: '{"id":${p4_first},"scenario":false}'
    response:
      expected_status: 400
      expected_body: '{"message":"invalid test case update payload"}'
  - request:
      method: POST
      path: /api/v1/test-case/update-change
      body: '{"id":${p4_first},"change_id":${p4_change}}'
    response:
      expected_status: 404
      expected_body: '{"message":"Not Found"}'

  # Independent error cases: each malformed field has otherwise valid input.
  # list: change_id omitted; other fields valid
  - request:
      method: POST
      path: /api/v1/test-case/list
      body: '{}'
    response:
      expected_status: 400
      expected_body: '{"message":"invalid test case payload"}'
  # list: change_id null; other fields valid
  - request:
      method: POST
      path: /api/v1/test-case/list
      body: '{"change_id":null}'
    response:
      expected_status: 400
      expected_body: '{"message":"invalid test case payload"}'
  # list: change_id string; other fields valid
  - request:
      method: POST
      path: /api/v1/test-case/list
      body: '{"change_id":"bad"}'
    response:
      expected_status: 400
      expected_body: '{"message":"invalid test case list payload"}'
  # list: change_id fraction; other fields valid
  - request:
      method: POST
      path: /api/v1/test-case/list
      body: '{"change_id":-1.5}'
    response:
      expected_status: 400
      expected_body: '{"message":"invalid test case list payload"}'
  # list: change_id integer underflow; other fields valid
  - request:
      method: POST
      path: /api/v1/test-case/list
      body: '{"change_id":-9223372036854775809}'
    response:
      expected_status: 400
      expected_body: '{"message":"invalid test case list payload"}'
  # list: array body
  - request:
      method: POST
      path: /api/v1/test-case/list
      body: '[]'
    response:
      expected_status: 400
      expected_body: '{"message":"invalid test case list payload"}'
  # list: string body
  - request:
      method: POST
      path: /api/v1/test-case/list
      body: '"invalid"'
    response:
      expected_status: 400
      expected_body: '{"message":"invalid test case list payload"}'
  # list: wrong HTTP method
  - request:
      method: GET
      path: /api/v1/test-case/list
    response:
      expected_status: 405
      expected_body: '{"message":"Method Not Allowed"}'
  # create: change_id omitted; other fields valid
  - request:
      method: POST
      path: /api/v1/test-case/create
      body: '{"scenario":"Valid"}'
    response:
      expected_status: 400
      expected_body: '{"message":"invalid test case payload"}'
  # create: change_id null; other fields valid
  - request:
      method: POST
      path: /api/v1/test-case/create
      body: '{"change_id":null,"scenario":"Valid"}'
    response:
      expected_status: 400
      expected_body: '{"message":"invalid test case payload"}'
  # create: change_id string; other fields valid
  - request:
      method: POST
      path: /api/v1/test-case/create
      body: '{"change_id":"bad","scenario":"Valid"}'
    response:
      expected_status: 400
      expected_body: '{"message":"invalid test case create payload"}'
  # create: change_id fraction; other fields valid
  - request:
      method: POST
      path: /api/v1/test-case/create
      body: '{"change_id":-1.5,"scenario":"Valid"}'
    response:
