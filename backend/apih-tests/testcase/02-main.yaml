app: apihydra
kind: steps
metadata:
  name: testcase-02-main
spec:
  steps:
  - request:
      method: POST
      path: /api/v1/test-case/list
      body: '{"change_id":${p4_change}}'
    response:
      expected_status: 200
      expected_body: '[]'
  - request:
      method: POST
      path: /api/v1/change/details
      body: '{"id":${p4_change}}'
    response:
      expected_status: 200
      expected_body: '{"id":${p4_change},"done_tc":0,"total_tc":0,"completed":0}'
  - request:
      method: POST
      path: /api/v1/epic/details
      body: '{"id":${p4_epic}}'
    response:
      expected_status: 200
      expected_body: '{"id":${p4_epic},"done_tc":0,"total_tc":0,"completed":0}'
  - request:
      method: POST
      path: /api/v1/test-case/create
      body: '{"change_id":${p4_change},"scenario":"  First case  "}'
    response:
      expected_status: 201
      expected_types:
        .id:
        - int
      capture:
        p4_first: .id
  - request:
      method: POST
      path: /api/v1/test-case/create
      body: '{"change_id":${p4_change},"scenario":"\t Second case \n"}'
    response:
      expected_status: 201
      expected_types:
        .id:
        - int
      capture:
        p4_second: .id
  - request:
      method: POST
      path: /api/v1/test-case/list
      body: '{"change_id":${p4_change}}'
    response:
      expected_status: 200
      expected_body: '[{"id":${p4_first},"change_id":${p4_change},"scenario":"First case","done":false},{"id":${p4_second},"change_id":${p4_change},"scenario":"Second
        case","done":false}]'
  - request:
      method: POST
      path: /api/v1/change/details
      body: '{"id":${p4_change}}'
    response:
      expected_status: 200
      expected_body: '{"id":${p4_change},"done_tc":0,"total_tc":2,"completed":0}'
  - request:
      method: POST
      path: /api/v1/epic/details
      body: '{"id":${p4_epic}}'
    response:
      expected_status: 200
      expected_body: '{"id":${p4_epic},"done_tc":0,"total_tc":2,"completed":0}'
  - request:
      method: POST
      path: /api/v1/test-case/update-done
      body: '{"id":${p4_first},"done":true}'
    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/change/details
      body: '{"id":${p4_change}}'
    response:
      expected_status: 200
      expected_body: '{"id":${p4_change},"done_tc":1,"total_tc":2,"completed":50}'
  - request:
      method: POST
      path: /api/v1/epic/details
      body: '{"id":${p4_epic}}'
    response:
      expected_status: 200
      expected_body: '{"id":${p4_epic},"done_tc":1,"total_tc":2,"completed":50}'
  - request:
      method: POST
      path: /api/v1/test-case/update-done
      body: '{"id":${p4_second},"done":true}'
    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/change/details
      body: '{"id":${p4_change}}'
    response:
      expected_status: 200
      expected_body: '{"id":${p4_change},"done_tc":2,"total_tc":2,"completed":100}'
  - request:
      method: POST
      path: /api/v1/epic/details
      body: '{"id":${p4_epic}}'
    response:
      expected_status: 200
      expected_body: '{"id":${p4_epic},"done_tc":2,"total_tc":2,"completed":100}'
  - request:
      method: POST
      path: /api/v1/test-case/update
      body: '{"id":${p4_second},"scenario":"  Edited case  "}'
    response:
      expected_status: 204
  - request:
      method: POST
      path: /api/v1/test-case/list
      body: '{"change_id":${p4_change}}'
    response:
      expected_status: 200
      expected_body: '[{"id":${p4_first},"change_id":${p4_change},"scenario":"First case","done":true},{"id":${p4_second},"change_id":${p4_change},"scenario":"Edited
        case","done":true}]'
  - request:
      method: POST
      path: /api/v1/test-case/update
      body: '{"id":${p4_second},"scenario":"Edited case"}'
    response:
      expected_status: 204
  - request:
