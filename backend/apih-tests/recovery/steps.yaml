app: apihydra
kind: steps
metadata:
  name: recovery-contracts
spec:
  defaults:
    retries: -1
    timeout: 5
    headers:
      Content-Type: application/json
  steps:
    - request:
        method: GET
        path: /api/v1/health
      response:
        expected_status: 200
        expected_body: "{\"status\":\"ok\",\"api\":\"ok\",\"database\":\"ok\"}"
    - request:
        method: GET
        path: /api/health
      response:
        expected_status: 200
        expected_body: "{\"status\":\"ok\",\"api\":\"ok\",\"database\":\"ok\"}"
    - request:
        method: POST
        path: /api/v1/project/get
        body: "{\"id\":3001}"
      response:
        expected_status: 200
        expected_body: "{\"id\":3001,\"name\":\"Outage parent\",\"config\":\"default\",\"last_ref\":0,\"change_count\":2}"
    - request:
        method: POST
        path: /api/v1/project/get
        body: "{\"id\":3002}"
      response:
        expected_status: 200
        expected_body: "{\"id\":3002,\"name\":\"Outage deletable project\",\"change_count\":0}"
    - request:
        method: POST
        path: /api/v1/epic/list
        body: "{\"project_id\":3001}"
      response:
        expected_status: 200
        expected_body: "[{\"id\":3101,\"project_id\":3001,\"name\":\"Outage epic\",\"done_tc\":1,\"total_tc\":2,\"completed\":50,\"change_count\":1},{\"id\":3102,\"project_id\":3001,\"name\":\"Outage deletable epic\",\"done_tc\":0,\"total_tc\":0,\"completed\":0,\"change_count\":0}]"
    - request:
        method: POST
        path: /api/v1/epic/get
        body: "{\"id\":3101}"
      response:
        expected_status: 200
        expected_body: "{\"id\":3101,\"project_id\":3001,\"name\":\"Outage epic\",\"done_tc\":1,\"total_tc\":2,\"completed\":50,\"change_count\":1}"
    - request:
        method: POST
        path: /api/v1/epic/get
        body: "{\"id\":3102}"
      response:
        expected_status: 200
        expected_body: "{\"id\":3102,\"project_id\":3001,\"name\":\"Outage deletable epic\",\"done_tc\":0,\"total_tc\":0,\"completed\":0,\"change_count\":0}"
    - request:
        method: POST
        path: /api/v1/change/get
        body: "{\"id\":3201}"
      response:
        expected_status: 200
        expected_body: "{\"id\":3201,\"project_id\":3001,\"epic_id\":3101,\"title\":\"Outage change\",\"open\":true,\"change_phase\":\"backlog\",\"change_types\":[],\"done_tc\":1,\"total_tc\":2,\"completed\":50,\"pr_url\":\"\"}"
    - request:
        method: POST
        path: /api/v1/change/get
        body: "{\"id\":3202}"
      response:
        expected_status: 200
        expected_body: "{\"id\":3202,\"project_id\":3001,\"title\":\"Outage deletable change\",\"total_tc\":0}"
    - request:
        method: POST
        path: /api/v1/change/list
        body: "{\"project_id\":3001}"
      response:
        expected_status: 200
        expected_body: "[{\"id\":3201,\"project_id\":3001,\"epic_id\":3101,\"title\":\"Outage change\",\"open\":true,\"change_phase\":\"backlog\",\"change_types\":[],\"done_tc\":1,\"total_tc\":2,\"completed\":50},{\"id\":3202,\"title\":\"Outage deletable change\",\"total_tc\":0}]"
    - request:
        method: POST
        path: /api/v1/change/documents
        body: "{\"id\":3201}"
      response:
        expected_status: 200
        expected_body: "[{\"id\":3401,\"doc_type\":\"brief\",\"body\":\"**Original document**\",\"html\":\"<p><strong>Original document</strong></p>\\n\",\"agent_edit\":false}]"
    - request:
        method: POST
        path: /api/v1/test-case/list
        body: "{\"change_id\":3201}"
      response:
        expected_status: 200
        expected_body: "[{\"id\":3301,\"change_id\":3201,\"scenario\":\"Original scenario\",\"done\":false},{\"id\":3302,\"change_id\":3201,\"scenario\":\"Retained delete target\",\"done\":true}]"
    - request:
        method: POST
        path: /api/v1/test-case/update
        body: "{\"id\":3301,\"scenario\":\"Recovery updated scenario\"}"
      response:
        expected_status: 204
    - request:
        method: POST
        path: /api/v1/test-case/list
        body: "{\"change_id\":3201}"
      response:
        expected_status: 200
        expected_body: "[{\"id\":3301,\"change_id\":3201,\"scenario\":\"Recovery updated scenario\",\"done\":false},{\"id\":3302,\"change_id\":3201,\"scenario\":\"Retained delete target\",\"done\":true}]"
    - request:
        method: POST
        path: /api/v1/test-case/update
        body: "{\"id\":3301,\"scenario\":\"Original scenario\"}"
      response:
        expected_status: 204
    - request:
        method: POST
        path: /api/v1/test-case/list
        body: "{\"change_id\":3201}"
      response:
        expected_status: 200
        expected_body: "[{\"id\":3301,\"change_id\":3201,\"scenario\":\"Original scenario\",\"done\":false},{\"id\":3302,\"change_id\":3201,\"scenario\":\"Retained delete target\",\"done\":true}]"
    - request:
        method: POST
        path: /api/v1/test-case/create
        body: "{\"change_id\":3202,\"scenario\":\"Recovery created scenario\"}"
      response:
        expected_status: 201
        expected_types:
          .id: [int]
        capture:
          recovery_case_id: .id
    - request:
        method: POST
        path: /api/v1/test-case/list
        body: "{\"change_id\":3202}"
      response:
        expected_status: 200
        expected_body: "[{\"id\":$recovery_case_id,\"change_id\":3202,\"scenario\":\"Recovery created scenario\",\"done\":false}]"
    - request:
        method: POST
        path: /api/v1/change/get
        body: "{\"id\":3202}"
      response:
        expected_status: 200
        expected_body: "{\"id\":3202,\"total_tc\":1,\"done_tc\":0,\"completed\":0}"
    - request:
        method: POST
        path: /api/v1/test-case/delete
        body: "{\"id\":$recovery_case_id}"
      response:
        expected_status: 204
    - request:
        method: POST
        path: /api/v1/test-case/list
        body: "{\"change_id\":3202}"
      response:
        expected_status: 200
        expected_body: "[]"
    - request:
        method: POST
        path: /api/v1/change/get
        body: "{\"id\":3202}"
      response:
        expected_status: 200
        expected_body: "{\"id\":3202,\"total_tc\":0,\"done_tc\":0,\"completed\":0}"
